<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ผู้ช่วยแปลภาษา</title>

  <!-- Tesseract OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3e8ff;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #713bb3;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .language {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    select {
      padding: 10px;
      border: 2px solid #c9a8f5;
      border-radius: 10px;
      font-size: 16px;
    }

    .box {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      resize: none;
    }

    button,
    .file-button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #8651c7;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: block;
      text-align: center;
    }

    button:hover,
    .file-button:hover {
      opacity: 0.9;
    }

    .file-button {
      background: #d47ac8;
    }

    .sound {
      background: #4d91d1;
    }

    #imageInput {
      display: none;
    }

    #status {
      text-align: center;
      color: #777;
      margin-top: 15px;
      display: none;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
      display: none;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #8651c7;
      transition: width 0.2s;
    }

    #cameraBox {
      display: none;
      margin-top: 15px;
      text-align: center;
    }

    #cameraVideo {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      background: #222;
    }

    #cameraCanvas {
      display: none;
    }

    .tip {
      background: #f7f1ff;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>🗣️ ผู้ช่วยแปลภาษา</h1>

  <div class="subtitle">
    Thai ↔ English Translator
  </div>


  <!-- เลือกภาษา -->

  <div class="language">

    <select id="fromLang">

      <option value="th">
        🇹🇭 ไทย
      </option>

      <option value="en">
        🇬🇧 English
      </option>

    </select>

    <b>→</b>

    <select id="toLang">

      <option value="en">
        🇬🇧 English
      </option>

      <option value="th">
        🇹🇭 ไทย
      </option>

    </select>

  </div>


  <!-- ข้อความต้นฉบับ -->

  <div class="box">

    <label>
      ข้อความต้นฉบับ
    </label>

    <textarea
      id="inputText"
      placeholder="พิมพ์ข้อความ หรือสแกนจากรูปภาพ"></textarea>


    <!-- เปิดกล้อง -->

    <button
      type="button"
      class="file-button"
      onclick="openCamera()">

      📷 เปิดกล้อง

    </button>


    <!-- กล้อง -->

    <div id="cameraBox">

      <video
        id="cameraVideo"
        autoplay
        playsinline>
      </video>


      <button
        type="button"
        onclick="takePhoto()">

        📸 ถ่ายภาพ

      </button>


      <button
        type="button"
        onclick="closeCamera()">

        ❌ ปิดกล้อง

      </button>


      <canvas id="cameraCanvas"></canvas>

    </div>


    <!-- เลือกรูป -->

    <label class="file-button">

      🖼️ เลือกรูปจากเครื่อง

      <input
        id="imageInput"
        type="file"
        accept="image/*"
        onchange="scanImage(event)">

    </label>


    <div class="tip">

      💡 <b>เคล็ดลับ:</b>
      ถ่ายภาพให้ตัวหนังสืออยู่ตรง ๆ
      มีแสงเพียงพอ และภาพไม่เบลอ
      เพื่อให้ระบบอ่านข้อความได้แม่นยำขึ้น

    </div>

  </div>


  <!-- สถานะ OCR -->

  <div id="status">
    กำลังอ่านข้อความจากรูป...
  </div>


  <div
    class="progress"
    id="progress">

    <div id="progressBar"></div>

  </div>


  <!-- แปลภาษา -->

  <button onclick="translateText()">

    🌐 แปลภาษา

  </button>


  <!-- ผลลัพธ์ -->

  <div class="box">

    <label>
      คำแปล
    </label>

    <textarea
      id="resultText"
      placeholder="คำแปลจะแสดงที่นี่"
      readonly>
    </textarea>


    <button
      class="sound"
      onclick="speakText()">

      🔊 อ่านออกเสียง

    </button>

  </div>

</div>



<script>


// ======================================================
// URL Google Apps Script
// ======================================================

const SCRIPT_URL =
  "ใส่ Web App URL ตรงนี้";



// ======================================================
// ระบบแปลภาษา
// ======================================================

async function translateText() {

  const text =
    document
      .getElementById("inputText")
      .value
      .trim();


  const from =
    document
      .getElementById("fromLang")
      .value;


  const to =
    document
      .getElementById("toLang")
      .value;


  const resultText =
    document
      .getElementById("resultText");


  if (text === "") {

    alert(
      "กรุณาใส่ข้อความก่อน"
    );

    return;
  }


  if (
    SCRIPT_URL ===
    "ใส่ Web App URL ตรงนี้"
  ) {

    alert(
      "ยังไม่ได้ใส่ Web App URL ของ Google Apps Script"
    );

    return;
  }


  if (from === to) {

    resultText.value =
      text;

    return;
  }


  resultText.value =
    "กำลังแปล...";


  try {

    const response =
      await fetch(

        SCRIPT_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              text: text,

              from: from,

              to: to

            })

        }

      );


    const data =
      await response.json();


    if (data.success) {

      resultText.value =
        data.result;

    } else {

      resultText.value =
        "";

      alert(
        "เกิดข้อผิดพลาด: " +
        data.error
      );

    }


  } catch (error) {

    console.error(error);

    resultText.value =
      "";

    alert(
      "ไม่สามารถเชื่อมต่อระบบแปลภาษาได้"
    );

  }

}



// ======================================================
// อ่านออกเสียง
// ======================================================

function speakText() {

  const text =
    document
      .getElementById("resultText")
      .value
      .trim();


  const lang =
    document
      .getElementById("toLang")
      .value;


  if (text === "") {

    alert(
      "ยังไม่มีคำแปล"
    );

    return;

  }


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  if (lang === "th") {

    speech.lang =
      "th-TH";

  } else {

    speech.lang =
      "en-US";

  }


  speech.rate =
    0.9;


  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(
    speech
  );

}



// ======================================================
// เตรียมภาพก่อน OCR
// ======================================================

function prepareImageForOCR(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {


              // --------------------------------
              // ขยายภาพ
              // --------------------------------

              let scale = 2;


              let width =
                img.width * scale;


              let height =
                img.height * scale;


              // จำกัดขนาดไม่ให้ใหญ่เกินไป

              const maxWidth =
                2500;


              const maxHeight =
                2500;


              if (
                width > maxWidth
              ) {

                const ratio =
                  maxWidth / width;

                width =
                  maxWidth;

                height =
                  height * ratio;

              }


              if (
                height > maxHeight
              ) {

                const ratio =
                  maxHeight / height;

                height =
                  maxHeight;

                width =
                  width * ratio;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(width);


              canvas.height =
                Math.round(height);


              const ctx =
                canvas.getContext(
                  "2d"
                );


              // --------------------------------
              // ทำพื้นหลังให้ขาว
              // --------------------------------

              ctx.fillStyle =
                "#ffffff";

              ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
              );


              // --------------------------------
              // เพิ่มความคม
              // --------------------------------

              ctx.imageSmoothingEnabled =
                false;


              ctx.drawImage(

                img,

                0,
                0,

                canvas.width,
                canvas.height

              );


              // --------------------------------
              // แปลงเป็นขาวดำ
              // --------------------------------

              const imageData =
                ctx.getImageData(

                  0,
                  0,

                  canvas.width,
                  canvas.height

                );


              const data =
                imageData.data;


              for (
                let i = 0;
                i < data.length;
                i += 4
              ) {


                const r =
                  data[i];


                const g =
                  data[i + 1];


                const b =
                  data[i + 2];


                // คำนวณความสว่าง

                const gray =
                  (
                    r * 0.299 +
                    g * 0.587 +
                    b * 0.114
                  );


                // ปรับ contrast

                let value =
                  (
                    gray - 128
                  ) * 1.5 + 128;


                value =
                  Math.max(
                    0,
                    Math.min(
                      255,
                      value
                    )
                  );


                data[i] =
                  value;


                data[i + 1] =
                  value;


                data[i + 2] =
                  value;

              }


              ctx.putImageData(
                imageData,
                0,
                0
              );


              canvas.toBlob(

                function(blob) {

                  if (blob) {

                    resolve(blob);

                  } else {

                    reject(
                      new Error(
                        "ไม่สามารถเตรียมภาพได้"
                      )
                    );

                  }

                },

                "image/png"

              );

            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "ไม่สามารถอ่านภาพได้"
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "ไม่สามารถโหลดภาพได้"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}



// ======================================================
// OCR
// ======================================================

async function scanImage(event) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  const status =
    document
      .getElementById("status");


  const progress =
    document
      .getElementById("progress");


  const progressBar =
    document
      .getElementById("progressBar");


  status.style.display =
    "block";


  progress.style.display =
    "block";


  progressBar.style.width =
    "0%";


  status.innerText =
    "🖼️ กำลังเตรียมภาพ...";


  try {


    // --------------------------------
    // ปรับภาพก่อน OCR
    // --------------------------------

    const processedImage =
      await prepareImageForOCR(
        file
      );


    status.innerText =
      "🔍 กำลังอ่านข้อความภาษาไทย...";


    progressBar.style.width =
      "10%";


    // --------------------------------
    // OCR
    // --------------------------------

    const result =
      await Tesseract.recognize(

        processedImage,

        "tha+eng",

        {

          logger:
            function(info) {


              console.log(info);


              if (
                info.status ===
                "recognizing text"
              ) {


                const percent =
                  Math.round(
                    info.progress * 100
                  );


                const displayPercent =
                  10 +
                  Math.round(
                    percent * 0.9
                  );


                progressBar.style.width =
                  displayPercent + "%";


                status.innerText =
                  "🔍 กำลังอ่านข้อความ... " +
                  percent +
                  "%";

              }


              else if (
                info.status ===
                "loading language traineddata"
              ) {

                status.innerText =
                  "📚 กำลังโหลดภาษาไทย...";

              }


              else if (
                info.status ===
                "initializing api"
              ) {

                status.innerText =
                  "⚙️ กำลังเตรียมระบบ OCR...";

              }

            }

        }

      );


    // --------------------------------
    // รับข้อความ
    // --------------------------------

    let text =
      result.data.text;


    // --------------------------------
    // ทำความสะอาดข้อความ
    // --------------------------------

    text =
      cleanOCRText(
        text
      );


    if (
      text.trim() === ""
    ) {

      status.innerText =
        "❌ ไม่พบข้อความในรูป";


      progressBar.style.width =
        "100%";


      return;

    }


    // --------------------------------
    // แสดงข้อความ
    // --------------------------------

    document
      .getElementById("inputText")
      .value =
      text;


    status.innerText =
      "✅ อ่านข้อความสำเร็จ";


    progressBar.style.width =
      "100%";


  } catch (error) {


    console.error(
      "OCR ERROR:",
      error
    );


    status.innerText =
      "❌ ไม่สามารถอ่านข้อความได้";


    progressBar.style.width =
      "0%";


    alert(
      "เกิดข้อผิดพลาดในการอ่านข้อความ กรุณาลองถ่ายภาพใหม่ให้ชัดขึ้น"
    );

  }

}



// ======================================================
// ทำความสะอาดข้อความ OCR
// ======================================================

function cleanOCRText(text) {


  if (!text) {

    return "";

  }


  // ลบช่องว่างซ้ำ

  text =
    text.replace(
      /[ \t]+/g,
      " "
    );


  // ลบบรรทัดว่างซ้ำ

  text =
    text.replace(
      /\n{3,}/g,
      "\n\n"
    );


  // ตัดช่องว่างต้นท้าย

  text =
    text.trim();


  return text;

}



// ======================================================
// ตัวแปรกล้อง
// ======================================================

let cameraStream =
  null;



// ======================================================
// เปิดกล้อง
// ======================================================

async function openCamera() {

  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      alert(
        "เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง"
      );

      return;

    }


    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


    const video =
      document
        .getElementById(
          "cameraVideo"
        );


    video.srcObject =
      cameraStream;


    document
      .getElementById(
        "cameraBox"
      )
      .style.display =
      "block";


  } catch (error) {


    console.error(
      "Camera error:",
      error
    );


    if (
      error.name ===
      "NotAllowedError"
    ) {

      alert(
        "ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณากด Allow"
      );


    } else if (
      error.name ===
      "NotFoundError"
    ) {

      alert(
        "ไม่พบกล้องในอุปกรณ์นี้"
      );


    } else {

      alert(
        "ไม่สามารถเปิดกล้องได้"
      );

    }

  }

}



// ======================================================
// ถ่ายภาพ
// ======================================================

function takePhoto() {


  const video =
    document
      .getElementById(
        "cameraVideo"
      );


  const canvas =
    document
      .getElementById(
        "cameraCanvas"
      );


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    alert(
      "กล้องยังไม่พร้อม กรุณารอสักครู่"
    );

    return;

  }


  // ใช้ความละเอียดจากกล้องจริง

  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const context =
    canvas.getContext(
      "2d"
    );


  context.imageSmoothingEnabled =
    false;


  context.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );


  canvas.toBlob(

    function(blob) {


      if (!blob) {

        alert(
          "ไม่สามารถบันทึกภาพได้"
        );

        return;

      }


      const file =
        new File(

          [blob],

          "camera-photo.jpg",

          {
            type:
              "image/jpeg"
          }

        );


      const fakeEvent = {

        target: {

          files: [file]

        }

      };


      scanImage(
        fakeEvent
      );


      closeCamera();


    },

    "image/jpeg",

    0.95

  );

}



// ======================================================
// ปิดกล้อง
// ======================================================

function closeCamera() {


  if (cameraStream) {


    cameraStream
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );


    cameraStream =
      null;

  }


  document
    .getElementById(
      "cameraVideo"
    )
    .srcObject =
    null;


  document
    .getElementById(
      "cameraBox"
    )
    .style.display =
    "none";

}


</script>

</body>
</html>
